name: Cumulus Networks
description: 'Cumulus Networks was a computer networking company founded in 2010 that
  developed Cumulus Linux, an open Linux-based network operating system for bare-metal
  and white-box data-center switches, along with NetQ, a network operations and telemetry
  platform. It was a pioneer of open, disaggregated networking, letting operators run
  a standard Linux distribution on commodity switching hardware. NVIDIA acquired Cumulus
  Networks in May 2020, and the products are now part of NVIDIA''s Ethernet switching
  and networking software line. The former cumulusnetworks.com and docs.cumulusnetworks.com
  domains now redirect to NVIDIA''s networking documentation. Surfaced as a portfolio
  company of a16z, Battery Ventures, and Wing Venture Capital.'
